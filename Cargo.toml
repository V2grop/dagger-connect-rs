[package]
name = "dagger-rs"
version = "0.2.1"
edition = "2024"
rust-version = "1.85"
description = "Independent encrypted reverse tunnel with locally pinned peer keys"
license = "MIT"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
hex = "0.4"
futures-util = { version = "0.3", features = ["sink"] }
rcgen = "0.13"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "2"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tokio-tungstenite = { version = "0.28", default-features = false, features = ["handshake"] }
tokio_kcp = { version = "0.9.8", path = "vendor/tokio_kcp" }
webpki-roots = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
snow = { version = "0.10", default-features = false, features = ["use-chacha20poly1305", "use-blake2", "use-curve25519", "use-getrandom"] }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
strip = true

