name: Linux Rust
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: linux-release-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Linux namespace test prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y iproute2 iputils-ping python3
      - name: Shell syntax checks
        run: |
          for script in setup.sh scripts/*.sh scripts/*.sh.in tests/*.sh; do
            bash -n "$script"
          done
      - name: Installer regression checks
        run: python3 -m unittest discover -s tests -p 'test_install.py' -v
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked --release --all-targets
      - run: cargo build --locked --release
      - name: Privileged Linux TUN integration
        run: |
          for carrier in tcp kcp http https ws wss xhttp xhttps dc6 quantum+; do
            sudo bash tests/tun_vm.sh target/release/dagger-rs "$carrier"
          done
      - name: Privileged raw TUN and Quantum matrix
        run: sudo bash tests/raw_vm.sh target/release/dagger-rs all
      - name: Combined TUN and port forwarding
        run: sudo bash tests/tun_forwarding_vm.sh target/release/dagger-rs
      - name: Offline Linux bundle packaging
        run: bash scripts/package-linux.sh target/release/dagger-rs dist

      - name: Preserve installation bundles
        uses: actions/upload-artifact@v4
        with:
          name: dagger-rs-linux-x86_64
          path: dist/*
      - name: Publish tested maintenance release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          tag=v0.2.1-v2grop.${GITHUB_RUN_NUMBER}
          gh release create "$tag" dist/* --target "$RELEASE_COMMIT" \
            --title "dagger-rs 0.2.1 — V2grop maintenance ${GITHUB_RUN_NUMBER}" \
            --notes-file docs/release-notes.md --latest

